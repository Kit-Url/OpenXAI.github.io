<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Private ChatGPT</title>
    <style>
        /* Sleek ChatGPT-style dark mode styling */
        body {
            margin: 0; padding: 0;
            background-color: #212121;
            color: #ececf1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }
        #chat-container {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; width: 100%;
        }
        .message { padding: 15px 20px; border-radius: 8px; line-height: 1.6; max-width: 85%; }
        .user { background-color: #2f2f2f; align-self: flex-end; color: #fff; }
        .ai { background-color: transparent; align-self: flex-start; border: 1px solid #424242; }
        #input-container {
            background-color: #212121; padding: 20px; display: flex; justify-content: center;
        }
        .input-box-wrapper {
            max-width: 800px; width: 100%; display: flex; background-color: #2f2f2f;
            border-radius: 24px; padding: 10px 20px; border: 1px solid #424242;
        }
        input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #fff; font-size: 16px; padding: 5px;
        }
        button {
            background: #fff; color: #000; border: none; padding: 8px 16px;
            border-radius: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #dcdcdc; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message ai">👋 Hello! I am your local Qwen model. Ask me anything—no logins, no fees!</div>
    </div>

    <div id="input-container">
        <div class="input-box-wrapper">
            <input type="text" id="user-input" placeholder="Message Qwen..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // POINT THIS TO YOUR NO-IP PUBLIC DOMAIN DOMAIN INSTEAD WHEN CONNECTING OUTSIDE HOME:
        const OLLAMA_API = "http://192.168.1";
        const MODEL_NAME = "qwen2.5:0.5b"; // Using the ultra-light fast model for your Xeon CPU

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const promptText = inputField.value.trim();
            if (!promptText) return;

            // 1. Render User message bubble
            inputField.value = "";
            chatContainer.innerHTML += `<div class="message user">${promptText}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. Prepare empty AI response skeleton structure
            const aiBubble = document.createElement("div");
            aiBubble.className = "message ai";
            aiBubble.innerText = "Thinking...";
            chatContainer.appendChild(aiBubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // 3. Make fetch request straight to your local router pipeline
                const response = await fetch(OLLAMA_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        prompt: promptText,
                        stream: false
                    })
                });

                const data = await response.json();
                aiBubble.innerText = data.response; // Output generated row answer
            } catch (error) {
                aiBubble.innerText = "Error: Could not reach your home AI engine. Is Ollama running?";
                console.error(error);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Allow sending messages by pressing the "Enter" key natively
        document.getElementById("user-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
